name: Build and Release Agent

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.target }})
    environment: prod
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            artifact: clawfeeder-agent-linux
          - os: macos-15-intel
            target: macos-x86_64
            artifact: clawfeeder-agent-macos-x86_64
          - os: macos-latest
            target: macos-arm64
            artifact: clawfeeder-agent-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements.build.txt

      - name: Generate build config
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        shell: bash
        run: |
          url="${BASE_URL:-https://clawfeeder.treero-ai.com}"
          printf 'BASE_URL = "%s"\nHEARTBEAT_INTERVAL = 60\n' "$url" > src/_build_config.py

      - name: Build binary
        run: pyinstaller --onefile --name clawfeeder-agent --runtime-tmpdir /var/tmp --clean entrypoint.py

      - name: Rename artifact
        run: mv dist/clawfeeder-agent dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp artifacts/clawfeeder-agent-linux/clawfeeder-agent-linux "release/clawfeeder-agent-${version}-linux"
          cp artifacts/clawfeeder-agent-macos-x86_64/clawfeeder-agent-macos-x86_64 "release/clawfeeder-agent-${version}-macos-x86_64"
          cp artifacts/clawfeeder-agent-macos-arm64/clawfeeder-agent-macos-arm64 "release/clawfeeder-agent-${version}-macos-arm64"
          chmod +x release/clawfeeder-agent-${version}-*
          cd release
          shasum -a 256 "clawfeeder-agent-${version}-linux" > "clawfeeder-agent-${version}-linux.sha256"
          shasum -a 256 "clawfeeder-agent-${version}-macos-x86_64" > "clawfeeder-agent-${version}-macos-x86_64.sha256"
          shasum -a 256 "clawfeeder-agent-${version}-macos-arm64" > "clawfeeder-agent-${version}-macos-arm64.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ github.ref_name }} >/dev/null 2>&1 || \
            gh release create ${{ github.ref_name }} \
              --title "ClawFeeder Agent ${{ github.ref_name }}" \
              --generate-notes

          gh release upload ${{ github.ref_name }} release/* \
            --clobber

      - name: Publish to public downloads repo
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          DOWNLOADS_REPO: junsiyang/clawfeeder-downloads
          DOWNLOAD_TAG: agent-${{ github.ref_name }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DOWNLOADS_REPO_TOKEN is not available to this job. Add it as a repository secret or a prod environment secret."
            exit 1
          fi

          gh release view "$DOWNLOAD_TAG" --repo "$DOWNLOADS_REPO" >/dev/null 2>&1 || \
            gh release create "$DOWNLOAD_TAG" \
              --repo "$DOWNLOADS_REPO" \
              --title "ClawFeeder Agent ${{ github.ref_name }}"

          gh release upload "$DOWNLOAD_TAG" release/* \
            --repo "$DOWNLOADS_REPO" \
            --clobber
